name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Defensible verification
    uses: MelodicBloom/.github/.github/workflows/reusable-node-verify-v2.yml@51d2de7b08a91cadc59a82899b25a46d78151fa2
    with:
      node-version: "24"
      package-manager: pnpm
      lint-command: pnpm run lint
      typecheck-command: pnpm run typecheck
      build-command: pnpm run build
      artifact-path: dist
      retention-days: 30
